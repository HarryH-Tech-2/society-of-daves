# Runs the Society's daily job: delivers gift memberships that are due
# (including Christmas Day gifts) and ends gifts that have run out.
#
# Setup: in GitHub, Settings > Secrets and variables > Actions, add
#   CRON_SECRET  - the same value as the CRON_SECRET environment variable in Vercel
#   SITE_URL     - https://societyofdaves.com

name: Daily gift delivery

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC every day: early on Christmas morning in the UK
  workflow_dispatch: {}

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver and expire gifts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          # Each call handles a small batch (to stay inside the hosting time
          # limit), so repeat until nothing is left.
          for i in $(seq 1 60); do
            result=$(curl -sS --fail -X POST "$SITE_URL/api/cron/daily" -H "Authorization: Bearer $CRON_SECRET")
            echo "$result"
            remaining=$(echo "$result" | jq -r '.remaining')
            [ "$remaining" = "0" ] && exit 0
            sleep 20
          done
          echo "Stopped after 60 batches with gifts still remaining" && exit 1
