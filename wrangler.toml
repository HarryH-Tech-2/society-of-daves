name = "society-of-daves"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[vars]
SITE_URL = "https://societyofdaves.com"
EMAIL_FROM = "The Society of Daves <hello@societyofdaves.com>"

# Secrets: set these in the Cloudflare dashboard (Settings > Variables and
# Secrets) or with `npx wrangler pages secret put NAME`. For local dev, copy
# .dev.vars.example to .dev.vars.
#   STRIPE_SECRET_KEY
#   STRIPE_PRICE_ID
#   STRIPE_GIFT_PRICE_6, STRIPE_GIFT_PRICE_12   (optional; from npm run stripe:setup)
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_PORTAL_URL
#   RESEND_API_KEY
#   RESEND_SEGMENT_ID   (optional)
#   CRON_SECRET         (any long random string; also add it to GitHub, see README)
